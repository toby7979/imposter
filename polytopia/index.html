<title>Polytopia Tribe Picker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: game-lobby column — a low-poly preview island on top, chunky navy menu panel, then the ranked tier list.
   Deliberately single-theme (dark navy, like the game's menus) so it looks the same on any device. */
:root {
  --bg: #15203a;
  --sea: #1b2c50;
  --panel: #22325a;
  --panel-2: #2e4274;
  --edge: #121b33;
  --fg: #ffffff;
  --muted: #a8b8dc;
  --accent: #3ec6f0;
  --accent-edge: #1f8db8;
  --gold: #ffc93c;
  --tier-s: #ffc93c;
  --tier-a: #6ad26a;
  --tier-b: #4fa8ee;
  --tier-c: #8b97b3;
  --tier-ink: #15203a;
  --font-display: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background:
    radial-gradient(120% 60% at 50% 0%, var(--sea) 0%, var(--bg) 70%) no-repeat,
    var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 16px;
  line-height: 1.4;
  min-height: 100%;
}
.wrap {
  max-width: 640px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 18px 40px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.display { font-family: var(--font-display); font-weight: 400; text-shadow: 0 3px 0 rgba(0,0,0,.35); letter-spacing: .01em; }

header { text-align: center; }
header h1 { font-size: 2.3rem; line-height: 1; margin: 0; text-wrap: balance; }
header p { margin: 6px 0 0; color: var(--muted); font-weight: 600; }

/* Preview island */
.island { position: relative; }
.island canvas { display: block; width: 100%; height: auto; }
.island .caption {
  text-align: center;
  font-size: .8rem;
  color: var(--muted);
  margin-top: 2px;
}

.panel {
  background: var(--panel);
  border-radius: 16px;
  box-shadow: 0 5px 0 var(--edge);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend {
  font-family: var(--font-display);
  font-size: 1.05rem;
  letter-spacing: .03em;
  margin-bottom: 8px;
  padding: 0;
}
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label {
  cursor: pointer;
  padding: 8px 14px;
  border-radius: 12px;
  background: var(--panel-2);
  box-shadow: 0 3px 0 var(--edge);
  font-weight: 800;
  font-size: .95rem;
  user-select: none;
  transition: transform .08s, box-shadow .08s, background .12s;
}
.seg label small { font-weight: 700; color: var(--muted); margin-left: 5px; font-variant-numeric: tabular-nums; }
.seg label:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge); }
.seg input:checked + label { background: var(--accent); color: var(--tier-ink); box-shadow: 0 3px 0 var(--accent-edge); }
.seg input:checked + label small { color: var(--tier-ink); opacity: .7; }
.seg input:focus-visible + label { outline: 3px solid var(--gold); outline-offset: 2px; }

details.owned summary { cursor: pointer; color: var(--muted); font-size: .95rem; }
details.owned .seg { margin-top: 10px; }
.owned-actions { display: flex; gap: 14px; margin-top: 12px; }
.linkbtn { background: none; border: 0; padding: 0; cursor: pointer; color: var(--accent); font: inherit; font-size: .9rem; }

/* Results */
.results { display: flex; flex-direction: column; gap: 14px; }
.tier { display: grid; grid-template-columns: 46px 1fr; gap: 10px; align-items: start; }
.tier-badge {
  font-family: var(--font-display);
  font-size: 1.6rem;
  line-height: 1;
  color: var(--tier-ink);
  height: 50px;
  display: grid;
  place-items: center;
  clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  background:
    linear-gradient(120deg, rgba(255,255,255,.35) 0 48%, transparent 48%),
    linear-gradient(240deg, rgba(0,0,0,.18) 0 46%, transparent 46%),
    var(--t);
}
.tier[data-t="S"] { --t: var(--tier-s); }
.tier[data-t="A"] { --t: var(--tier-a); }
.tier[data-t="B"] { --t: var(--tier-b); }
.tier[data-t="C"] { --t: var(--tier-c); }
.tier-list { display: flex; flex-direction: column; gap: 8px; min-width: 0; }

.tribe {
  display: grid;
  grid-template-columns: 34px 1fr auto;
  gap: 12px;
  align-items: center;
  background: var(--panel);
  border-radius: 12px;
  box-shadow: 0 4px 0 var(--edge);
  padding: 10px 12px;
}
.tribe .rank { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .85rem; }
.tribe .name { font-size: 1.05rem; font-weight: 800; }
.tribe .note { color: var(--muted); font-size: .88rem; font-weight: 600; }
.tribe .body { min-width: 0; }
.shield {
  width: 34px; height: 38px;
  clip-path: polygon(50% 0, 100% 22%, 100% 62%, 50% 100%, 0 62%, 0 22%);
  background:
    linear-gradient(90deg, rgba(255,255,255,.28) 0 50%, transparent 50%),
    linear-gradient(180deg, transparent 0 60%, rgba(0,0,0,.22) 60%),
    var(--c);
}
.tier[data-t="S"] .tribe { box-shadow: 0 4px 0 var(--edge), inset 0 0 0 3px var(--tier-s); padding: 14px; }
.tier[data-t="S"] .tribe .name { font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; text-shadow: 0 2px 0 rgba(0,0,0,.35); }
.stars { color: var(--gold); letter-spacing: 2px; font-size: .9rem; }
.why { margin: 6px 0 0; padding-left: 18px; font-size: .88rem; font-weight: 600; }
.why li { margin: 2px 0; }
.empty { color: var(--muted); }
footer { color: var(--muted); font-size: .8rem; font-weight: 600; text-align: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1 class="display">Tribe Picker</h1>
    <p>Set up your game. Best tribe for it comes out on top.</p>
  </header>

  <div class="island">
    <canvas id="map" aria-label="Low-poly preview of the chosen map type, in the top tribe's colours" role="img"></canvas>
    <div class="caption" id="map-caption"></div>
  </div>

  <form class="panel" id="setup" onsubmit="return false">
    <fieldset>
      <legend>Opponents</legend>
      <div class="seg" id="opp"></div>
    </fieldset>
    <fieldset>
      <legend>Map type</legend>
      <div class="seg" id="type"></div>
    </fieldset>
    <fieldset>
      <legend>Map size</legend>
      <div class="seg" id="size"></div>
    </fieldset>
    <details class="owned" id="owned-box">
      <summary id="owned-summary">Tribes I own: all 16</summary>
      <div class="seg" id="owned"></div>
      <div class="owned-actions">
        <button type="button" class="linkbtn" id="own-all">Select all</button>
        <button type="button" class="linkbtn" id="own-free">Free tribes only</button>
      </div>
    </details>
  </form>

  <section class="results" id="results" aria-live="polite"></section>

  <footer>
    Unofficial fan-made tool, not affiliated with Midjiwan or The Battle of Polytopia.
    Rankings are a rule of thumb built from common community advice, not official game data.
  </footer>
</div>

<script>
// ---------- Game data ----------
const OPPONENTS = [
  { id: 1, label: "1" }, { id: 2, label: "2" }, { id: 4, label: "4" }, { id: 9, label: "9" },
];
// w = how much water-strength matters, l = how much land-strength matters
const MAP_TYPES = [
  { id: "drylands",    label: "Drylands",    w: -0.4, l: 1.2 },
  { id: "lakes",       label: "Lakes",       w: 0.5,  l: 0.7 },
  { id: "pangea",      label: "Pangea",      w: 0.1,  l: 1.0 },
  { id: "continents",  label: "Continents",  w: 0.9,  l: 0.5 },
  { id: "archipelago", label: "Archipelago", w: 1.4,  l: 0 },
  { id: "waterworld",  label: "Water World", w: 1.9,  l: -0.3 },
];
// e = how much a fast start matters, g = how much long-game growth matters
const SIZES = [
  { id: "tiny",    label: "Tiny",    tiles: 121, e: 1.2,  g: -0.4 },
  { id: "small",   label: "Small",   tiles: 196, e: 0.8,  g: 0 },
  { id: "normal",  label: "Normal",  tiles: 256, e: 0.4,  g: 0.4 },
  { id: "large",   label: "Large",   tiles: 324, e: 0,    g: 0.8 },
  { id: "huge",    label: "Huge",    tiles: 400, e: -0.2, g: 1.1 },
  { id: "massive", label: "Massive", tiles: 900, e: -0.4, g: 1.4 },
];
const OPP_WEIGHTS = { 1: { e: 0.7, g: -0.2 }, 2: { e: 0.3, g: 0.1 }, 4: { e: 0, g: 0.4 }, 9: { e: -0.3, g: 0.8 } };

// base = all-round strength; water/land/early/late = how the tribe likes each condition (-2..3)
// ground/tree = colours used to paint the preview island when this tribe is the top pick
const TRIBES = [
  { id: "bardur",   name: "Bardur",   c: "#5a4636", ground: "#9fae8c", tree: "#3f6b4a", free: true,  base: 3, water: 0,  land: 2,  early: 2,  late: 1, note: "Hunting start and a sturdy economy. Hard to go wrong with." },
  { id: "imperius", name: "Imperius", c: "#2f57d6", ground: "#8cc95a", tree: "#3e8a3a", free: true,  base: 3, water: 0,  land: 1,  early: 1,  late: 2, note: "Smooth, flexible economy that grows into anything." },
  { id: "oumaji",   name: "Oumaji",   c: "#e8c72c", ground: "#e6cf7c", tree: "#8ea040", free: true,  base: 2, water: -2, land: 3,  early: 3,  late: -1, note: "Riders from turn one. Brutal on small open maps." },
  { id: "xinxi",    name: "Xin-xi",   c: "#cc2a2a", ground: "#74ad55", tree: "#2f6e3a", free: true,  base: 2, water: -1, land: 2,  early: 2,  late: 0, note: "Mountain start with strong defence and quick early pushes." },
  { id: "aimo",     name: "Ai-Mo",    c: "#2fbf9a", ground: "#c4d6ae", tree: "#5f8f6a", free: false, base: 3, water: 0,  land: 1,  early: 0,  late: 3, note: "Calm, high-scoring economy that snowballs with space." },
  { id: "kickoo",   name: "Kickoo",   c: "#36c24a", ground: "#74d867", tree: "#2e9a4a", free: false, base: 3, water: 3,  land: -1, early: 1,  late: 1, note: "Fishing start and rich coasts. King of watery maps." },
  { id: "cymanti",  name: "Cymanti",  c: "#9bd13a", ground: "#c9d46c", tree: "#c0569a", free: false, base: 3, water: 2,  land: 0,  early: 1,  late: 2, note: "Special tribe. Bugs, poison and algae; strong on lakes and seas." },
  { id: "elyrion",  name: "Elyrion",  c: "#d9318c", ground: "#9ee08c", tree: "#d45aa8", free: false, base: 2, water: 0,  land: 1,  early: -1, late: 3, note: "Special tribe. Enchanted forests and dragons late on." },
  { id: "aquarion", name: "Aquarion", c: "#e88a8a", ground: "#9fd4b4", tree: "#3f9a8a", free: false, base: 2, water: 3,  land: -1, early: 0,  late: 1, note: "Special tribe. Amphibious units built for water maps." },
  { id: "polaris",  name: "Polaris",  c: "#9fd8ef", ground: "#eaf5fa", tree: "#8fb8cc", free: false, base: 1, water: 2,  land: 0,  early: -1, late: 2, note: "Special tribe. Freezes land and sea into ice it controls." },
  { id: "luxidoor", name: "Luxidoor", c: "#9b46c9", ground: "#b896d4", tree: "#6a4a9a", free: false, base: 1, water: 0,  land: 1,  early: -2, late: 3, note: "Rich, big capital. Slow start, strong long game." },
  { id: "yadakk",   name: "Yadakk",   c: "#8a3428", ground: "#d2b47a", tree: "#7a8a3a", free: false, base: 1, water: -1, land: 2,  early: 0,  late: 2, note: "Roads and trade. Shines once your cities are connected." },
  { id: "vengir",   name: "Vengir",   c: "#b8c0c4", ground: "#8f9478", tree: "#4a5a3a", free: false, base: 1, water: -1, land: 2,  early: 2,  late: -1, note: "Gets swordsmen out early. Good for a fast land fight." },
  { id: "hoodrick", name: "Hoodrick", c: "#a2762b", ground: "#c2ab52", tree: "#b8642a", free: false, base: 1, water: -1, land: 1,  early: 1,  late: 1, note: "Archers and forests. Solid, defensive play." },
  { id: "quetzali", name: "Quetzali", c: "#2aa3b8", ground: "#84c99c", tree: "#2f8a5a", free: false, base: 1, water: -1, land: 1,  early: 1,  late: 1, note: "Defenders and fruit-heavy land. Tough to break." },
  { id: "zebasi",   name: "Zebasi",   c: "#e07a1f", ground: "#d4bb5c", tree: "#6a8a2a", free: false, base: 1, water: -1, land: 2,  early: -1, late: 1, note: "Farming economy. Happiest on open, dry land." },
];

// ---------- State ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem("polypick:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("polypick:" + k, JSON.stringify(v)); } catch {} },
};
const state = {
  opp: store.get("opp", 2),
  type: store.get("type", "continents"),
  size: store.get("size", "normal"),
  owned: new Set(store.get("owned", TRIBES.map(t => t.id))),
};

// ---------- Scoring ----------
function scoreTribe(t) {
  const mt = MAP_TYPES.find(m => m.id === state.type);
  const sz = SIZES.find(s => s.id === state.size);
  const op = OPP_WEIGHTS[state.opp];
  const parts = {
    water: t.water * mt.w,
    land:  t.land * mt.l,
    early: t.early * (sz.e + op.e),
    late:  t.late * (sz.g + op.g),
  };
  const total = t.base + parts.water + parts.land + parts.early + parts.late;
  return { t, total, parts };
}

function reasons(r) {
  const mt = MAP_TYPES.find(m => m.id === state.type);
  const sz = SIZES.find(s => s.id === state.size);
  const out = [];
  const sorted = Object.entries(r.parts).filter(([, v]) => v >= 0.5).sort((a, b) => b[1] - a[1]);
  for (const [k] of sorted.slice(0, 2)) {
    if (k === "water") out.push(`${mt.label} has lots of water, and this tribe is at home on it.`);
    if (k === "land")  out.push(`${mt.label} is land-heavy, which suits how this tribe expands and fights.`);
    if (k === "early") out.push(state.opp === 1
      ? `A one-on-one on a ${sz.label.toLowerCase()} map rewards a fast start.`
      : `A ${sz.label.toLowerCase()} map means early fights, and this tribe starts quickly.`);
    if (k === "late")  out.push(state.opp >= 4
      ? `${state.opp} opponents means a long game, and this tribe grows strong over time.`
      : `A ${sz.label.toLowerCase()} map gives room to build, which this tribe uses well.`);
  }
  if (!out.length) out.push("A strong all-rounder that fits this setup.");
  return out;
}

function ranking() {
  return TRIBES.filter(t => state.owned.has(t.id)).map(scoreTribe).sort((a, b) => b.total - a.total);
}

// ---------- Low-poly preview island ----------
// Our own art in the game's flat, faceted style: an isometric diamond of tiles,
// shaped by the map type and painted in the top tribe's terrain colours.
function rng(seed) {
  let a = seed >>> 0;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function hash(s) { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h; }
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = c => Math.max(0, Math.min(255, Math.round(amt < 0 ? c * (1 + amt) : c + (255 - c) * amt)));
  return `rgb(${f(n >> 16)},${f(n >> 8 & 255)},${f(n & 255)})`;
}

const GRID = { tiny: 9, small: 11, normal: 12, large: 14, huge: 16, massive: 20 };
const SHAPES = {
  drylands:    { water: 0.06, blobs: 6,  r: 0.35, centre: false },
  lakes:       { water: 0.22, blobs: 7,  r: 0.30, centre: false },
  pangea:      { water: 0.36, blobs: 4,  r: 0.30, centre: true },
  continents:  { water: 0.50, blobs: 3,  r: 0.26, centre: false },
  archipelago: { water: 0.62, blobs: 11, r: 0.12, centre: false },
  waterworld:  { water: 0.84, blobs: 6,  r: 0.09, centre: false },
};

function drawMap(top) {
  const cv = document.getElementById("map");
  const W = cv.parentElement.clientWidth;
  if (!W) return;
  const N = GRID[state.size];
  const shape = SHAPES[state.type];
  const R = rng(hash(state.type + state.size + state.opp));

  // Heights from soft blobs, then pick the sea level that gives the right share of water.
  const blobs = [];
  if (shape.centre) blobs.push({ x: N / 2, y: N / 2, r: N * 0.42, w: 1.4 });
  for (let b = 0; b < shape.blobs; b++) {
    blobs.push({ x: 1 + R() * (N - 2), y: 1 + R() * (N - 2), r: N * shape.r * (0.7 + R() * 0.6), w: 0.7 + R() * 0.6 });
  }
  const h = [];
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    let v = R() * 0.25;
    for (const b of blobs) { const d2 = (i - b.x) ** 2 + (j - b.y) ** 2; v += b.w * Math.exp(-d2 / (b.r * b.r)); }
    const edge = Math.min(i, j, N - 1 - i, N - 1 - j);
    if (state.type !== "drylands" && state.type !== "lakes" && edge === 0) v *= 0.4;
    h.push(v);
  }
  const sorted = [...h].sort((a, b) => a - b);
  const sea = sorted[Math.min(sorted.length - 1, Math.floor(shape.water * sorted.length))];
  const landSorted = sorted.filter(v => v >= sea);
  const peak = landSorted[Math.floor(landSorted.length * 0.86)] ?? Infinity;
  const isLand = (i, j) => i >= 0 && j >= 0 && i < N && j < N && h[i * N + j] >= sea;

  // Tile kinds
  const kind = h.map((v, k) => {
    if (v < sea) return "water";
    if (v >= peak && R() < 0.75) return "mountain";
    return R() < 0.3 ? "forest" : "grass";
  });
  // Capital on the grass tile nearest the middle of the land
  let cap = -1, best = Infinity;
  kind.forEach((k, idx) => {
    if (k !== "grass") return;
    const d = (Math.floor(idx / N) - N / 2) ** 2 + (idx % N - N / 2) ** 2;
    if (d < best) { best = d; cap = idx; }
  });

  // Geometry
  const pad = 6;
  const tw = (W - pad * 2) / N, th = tw / 2, depth = Math.max(3, th * 0.32);
  const topPad = th * 1.4;
  const H = Math.ceil(topPad + N * th + depth + pad);
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.height = H + "px";
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.lineJoin = "round";

  const poly = (pts, fill) => {
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let p = 1; p < pts.length; p++) ctx.lineTo(pts[p][0], pts[p][1]);
    ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
    ctx.strokeStyle = fill; ctx.lineWidth = 0.6; ctx.stroke();
  };

  const ground = top ? top.ground : "#8cc95a";
  const tree = top ? top.tree : "#3e8a3a";
  const roof = top ? top.c : "#2f57d6";
  const x0 = W / 2, y0 = topPad;

  // Back to front so nearer tiles overlap farther ones
  for (let s = 0; s <= 2 * (N - 1); s++) {
    for (let i = 0; i < N; i++) {
      const j = s - i;
      if (j < 0 || j >= N) continue;
      const idx = i * N + j, k = kind[idx];
      const cx = x0 + (i - j) * tw / 2, cy = y0 + (i + j) * th / 2;
      const jit = (R() - 0.5) * 0.08;

      if (k === "water") {
        const coast = isLand(i - 1, j) || isLand(i + 1, j) || isLand(i, j - 1) || isLand(i, j + 1);
        const base = coast ? "#58bdf0" : "#3a8fd8";
        const yT = cy + depth;
        poly([[cx, yT], [cx + tw / 2, yT + th / 2], [cx, yT + th], [cx - tw / 2, yT + th / 2]], shade(base, jit));
        poly([[cx, yT], [cx, yT + th], [cx - tw / 2, yT + th / 2]], shade(base, 0.07 + jit));
        continue;
      }

      const g = shade(ground, jit);
      // Block sides
      poly([[cx - tw / 2, cy + th / 2], [cx, cy + th], [cx, cy + th + depth], [cx - tw / 2, cy + th / 2 + depth]], shade(ground, -0.22));
      poly([[cx, cy + th], [cx + tw / 2, cy + th / 2], [cx + tw / 2, cy + th / 2 + depth], [cx, cy + th + depth]], shade(ground, -0.36));
      // Top, split into two facets
      poly([[cx, cy], [cx + tw / 2, cy + th / 2], [cx, cy + th]], g);
      poly([[cx, cy], [cx, cy + th], [cx - tw / 2, cy + th / 2]], shade(ground, 0.1 + jit));

      const mx = cx, my = cy + th / 2;
      if (k === "mountain") {
        const mw = tw * 0.42, apex = [mx + (R() - 0.5) * tw * 0.08, my - th * 1.25];
        poly([[mx - mw, my + th * 0.12], [mx, my + th * 0.35], apex], "#c9ccd6");
        poly([[mx, my + th * 0.35], [mx + mw, my + th * 0.12], apex], "#8d93a6");
        const t = 0.32;
        const lerp = (a, b) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
        poly([lerp(apex, [mx - mw, my + th * 0.12]), lerp(apex, [mx, my + th * 0.35]), apex], "#ffffff");
        poly([lerp(apex, [mx, my + th * 0.35]), lerp(apex, [mx + mw, my + th * 0.12]), apex], "#dfe4ee");
      } else if (k === "forest") {
        const spots = [[-0.16, -0.02], [0.14, 0.06], [0, 0.16]];
        for (const [dx, dy] of spots) {
          const bx = mx + dx * tw, by = my + dy * th, tw2 = tw * 0.12, tH = th * 0.95;
          poly([[bx - tw2, by], [bx, by + th * 0.08], [bx, by - tH]], shade(tree, 0.12));
          poly([[bx, by + th * 0.08], [bx + tw2, by], [bx, by - tH]], shade(tree, -0.2));
        }
      } else if (idx === cap) {
        const bw = tw * 0.22, bh = th * 0.55, by = my + th * 0.15;
        poly([[mx - bw, by - bh], [mx, by - bh + th * 0.18], [mx, by + th * 0.18], [mx - bw, by]], "#f2e6cf");
        poly([[mx, by - bh + th * 0.18], [mx + bw, by - bh], [mx + bw, by], [mx, by + th * 0.18]], "#cdbd9c");
        const rp = [mx, by - bh - th * 0.75];
        poly([[mx - bw * 1.15, by - bh], [mx, by - bh + th * 0.22], rp], shade(roof, 0.1));
        poly([[mx, by - bh + th * 0.22], [mx + bw * 1.15, by - bh], rp], shade(roof, -0.25));
      }
    }
  }

  const sz = SIZES.find(s => s.id === state.size), mt = MAP_TYPES.find(m => m.id === state.type);
  document.getElementById("map-caption").textContent =
    `${mt.label} · ${sz.label}${top ? ` · ${top.name} land` : ""}`;
}

// ---------- Rendering ----------
const $ = id => document.getElementById(id);

function segButtons(container, name, items, current, labelFn) {
  container.innerHTML = items.map(it => {
    const id = `${name}-${it.id}`;
    return `<input type="radio" name="${name}" id="${id}" value="${it.id}" ${String(it.id) === String(current) ? "checked" : ""}>` +
           `<label for="${id}">${labelFn(it)}</label>`;
  }).join("");
}

function renderControls() {
  segButtons($("opp"), "opp", OPPONENTS, state.opp, o => o.label);
  segButtons($("type"), "type", MAP_TYPES, state.type, m => m.label);
  segButtons($("size"), "size", SIZES, state.size, s => `${s.label}<small>${s.tiles}</small>`);
  renderOwned();
}

function renderOwned() {
  $("owned").innerHTML = TRIBES.map(t =>
    `<input type="checkbox" id="own-${t.id}" value="${t.id}" ${state.owned.has(t.id) ? "checked" : ""}>` +
    `<label for="own-${t.id}">${t.name}</label>`
  ).join("");
  const n = state.owned.size;
  $("owned-summary").textContent = n === TRIBES.length ? "Tribes I own: all 16" : `Tribes I own: ${n} of 16`;
}

function render() {
  const ranked = ranking();
  drawMap(ranked[0] && ranked[0].t);
  if (!ranked.length) {
    $("results").innerHTML = `<p class="empty">Pick at least one tribe you own to see a ranking.</p>`;
    return;
  }
  // S tier: always the top pick, plus the runner-up only if it's genuinely close. Never more than two.
  const sCount = ranked.length > 1 && ranked[0].total - ranked[1].total <= 0.6 ? 2 : 1;
  const rest = ranked.slice(sCount);
  const tiers = [
    ["S", ranked.slice(0, sCount)],
    ["A", rest.slice(0, 4)],
    ["B", rest.slice(4, 9)],
    ["C", rest.slice(9)],
  ].filter(([, list]) => list.length);

  let rank = 0;
  $("results").innerHTML = tiers.map(([tier, list]) => `
    <div class="tier" data-t="${tier}">
      <div class="tier-badge" aria-label="${tier} tier">${tier}</div>
      <div class="tier-list">
        ${list.map(r => {
          rank++;
          const top = tier === "S";
          const why = top ? `<ul class="why">${reasons(r).map(x => `<li>${x}</li>`).join("")}</ul>` : "";
          return `<div class="tribe">
            <div class="shield" style="--c:${r.t.c}" aria-hidden="true"></div>
            <div class="body">
              ${top ? `<div class="stars" aria-hidden="true">★★★</div>` : ""}
              <div class="name">${r.t.name}</div>
              <div class="note">${r.t.note}</div>
              ${why}
            </div>
            <div class="rank">#${rank}</div>
          </div>`;
        }).join("")}
      </div>
    </div>`).join("");
}

$("setup").addEventListener("change", e => {
  const el = e.target;
  if (el.name === "opp") state.opp = Number(el.value);
  else if (el.name === "type") state.type = el.value;
  else if (el.name === "size") state.size = el.value;
  else if (el.id.startsWith("own-")) {
    el.checked ? state.owned.add(el.value) : state.owned.delete(el.value);
    renderOwned();
  }
  store.set("opp", state.opp); store.set("type", state.type); store.set("size", state.size);
  store.set("owned", [...state.owned]);
  render();
});
$("own-all").addEventListener("click", () => {
  state.owned = new Set(TRIBES.map(t => t.id));
  store.set("owned", [...state.owned]); renderOwned(); render();
});
$("own-free").addEventListener("click", () => {
  state.owned = new Set(TRIBES.filter(t => t.free).map(t => t.id));
  store.set("owned", [...state.owned]); renderOwned(); render();
});
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 150); });

renderControls();
render();
if (document.fonts) document.fonts.ready.then(render);
</script>
